.at-root{transition:background .9s var(--ease),color .9s var(--ease)}
.at-in{animation:at-in .7s var(--ease) both}
.at-rise{animation:at-in .9s var(--ease) both;animation-delay:.08s}
.at-slide{transition:transform .6s var(--ease),background-color .5s var(--ease),border-color .5s var(--ease),color .5s var(--ease)}
.at-arc{transition:stroke-dasharray 1s linear,stroke .6s var(--ease),stroke-opacity .6s var(--ease)}
.at-lin{transition:transform 1s linear,clip-path 1s linear,opacity 1s linear}
.at-halo{transform-box:fill-box;transform-origin:center;animation:at-halo 3.4s var(--ease) infinite}
.at-sweep{animation:at-spin 16s linear infinite}
.at-aura{animation:at-aura 26s ease-in-out infinite alternate}
.at-wave{animation:at-wave 9s linear infinite}
.at-wave2{animation:at-wave 15s linear infinite reverse}
.at-bub{animation:at-bub 9s ease-in infinite}
.at-cloud{animation:at-drift 90s linear infinite}
.at-cloud2{animation:at-drift 130s linear infinite;animation-delay:-60s}
.at-tw{animation:at-tw 5s ease-in-out infinite}
.at-tw2{animation:at-tw 7s ease-in-out infinite;animation-delay:-3s}
.at-glint{transform-origin:top center;animation:at-glint 6s ease-in-out infinite}
.at-shim{animation:at-shim 3.8s var(--ease) infinite}
.at-float{animation:at-float 7s ease-in-out infinite}
.at-scrim{animation:at-fade .5s var(--ease) both}
.at-sheet-up{animation:at-up .7s var(--ease) both}
.at-sheet-side{animation:at-side .7s var(--ease) both}
.at-sheet-body{scrollbar-width:thin}
@keyframes at-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes at-halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes at-spin{to{transform:rotate(360deg)}}
@keyframes at-aura{0%{transform:translate(-6%,-3%) scale(1)}100%{transform:translate(6%,4%) scale(1.12)}}
@keyframes at-wave{to{transform:translateX(-358px)}}
@keyframes at-bub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.55}100%{transform:translateY(-240px) scale(1.1);opacity:0}}
@keyframes at-drift{from{transform:translateX(-170px)}to{transform:translateX(420px)}}
@keyframes at-tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes at-glint{0%,100%{transform:scaleX(.6);opacity:.35}50%{transform:scaleX(1);opacity:.7}}
@keyframes at-shim{0%{transform:translateX(-120%)}100%{transform:translateX(420%)}}
@keyframes at-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes at-fade{from{opacity:0}to{opacity:1}}
@keyframes at-up{from{opacity:0;transform:translateY(72px)}to{opacity:1;transform:none}}
@keyframes at-side{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
