<style>

:root{--ease:cubic-bezier(.22,1,.36,1)}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease),transform .18s var(--ease)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--at-focus,#5BE0E8);outline-offset:3px}
.at-root{transition:background .9s var(--ease),color .9s var(--ease)}
.at-slide{transition:transform .6s var(--ease),background-color .5s var(--ease),border-color .5s var(--ease),color .5s var(--ease)}
.at-in{animation:at-in .7s var(--ease) both}
.at-halo{transform-box:fill-box;transform-origin:center;animation:at-halo 3.4s var(--ease) infinite}
.at-aura{animation:at-aura 26s ease-in-out infinite alternate}
.at-u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.at-u:hover{text-decoration-thickness:2px}
@keyframes at-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes at-halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes at-aura{0%{transform:translate(-6%,-3%) scale(1)}100%{transform:translate(6%,4%) scale(1.12)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.atw-in{animation:atw-in .6s var(--ease) both}
.atw-flash{animation:atw-flash 1s ease-in-out 3}
@keyframes atw-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes atw-flash{50%{background-color:transparent}}
</style>

      <sc-if value="{{noDigits}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">{{minimalNote}}</span>
      </sc-if>
      <sc-if value="{{live}}" hint-placeholder-val="{{false}}">
        <button onClick="{{stop}}" style="{{btnStopS}}">Stop</button>

    </div>
  </sc-if>

</div>

// Header (§11.6): 60 phone / 68 ≥ tablet, gutter = page gutter, logo 26 + wordmark 17 with gap 8, nav on desktop, theme switch as a segmented bar.
const AT_NAV = [['Use cases', '#', 'for'], ['Devices', '#', 'on'], ['Extension', 'PageExtensionDesk.dc.html', 'extension'], ['Pro', 'Pro.dc.html', 'pro']];

/* ── end primitives ── */

// Embed: compact 320 × 104 (O-58; pill XS, r16, padding 12 12 12 16) and full width × 240 (pill S, r28, padding 16 24).
const QUICK = [5, 10, 15, 30, 60];
let wid = 0;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.tid = 'atwTimers' + (++wid);
    this.state = Object.assign({ theme: props.theme ?? 'auto', sysDark: this.sys(), now: Date.now(), announce: '' }, this.seed(props));
  }
  sys() { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; } }
  seed(p) {
    const now = Date.now();
    const run = !!p.running;
    const cookFull = (p.mode ?? 'cook') === 'cook' && (p.size ?? 'full') === 'full';
    return {
      lock: run ? 'held' : 'idle', paused: false, el: run ? 754 : 0, startedAt: now - 754000,
      timers: run && cookFull ? [{ id: 'a', name: 'Timer 1', endsAt: now + 492000, doneAt: null }, { id: 'b', name: 'Timer 2', endsAt: now + 1420000, doneAt: null }] : [], nextN: 3
    };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 1000);
    try {
      this.mq = window.matchMedia('(prefers-color-scheme: dark)');
      this.onMq = (e) => this.setState({ sysDark: e.matches });
      this.mq.addEventListener('change', this.onMq);
    } catch (e) {}
  }
  componentWillUnmount() {

    clearTimeout(this.boot);
    if (this.mq) this.mq.removeEventListener('change', this.onMq);
  }
  componentDidUpdate(prev) {
    const p = this.props;

    if (prev.running !== p.running || prev.mode !== p.mode || prev.size !== p.size) this.setState(this.seed(p));
  }
  tick() {
    const s = this.state;
    const now = Date.now();
    const next = { now };
    if (s.lock === 'held' && !s.paused) next.el = s.el + 1;
    if (s.timers.some((k) => k.doneAt === null && k.endsAt <= now)) {
      const done = s.timers.filter((k) => k.doneAt === null && k.endsAt <= now);

  }

  }
  ms(sec) {
    const v = Math.max(0, Math.ceil(sec));
    const h = Math.floor(v / 3600), m = Math.floor((v % 3600) / 60), s = v % 60;
    const p = (n) => String(n).padStart(2, '0');

  }

    this.boot = setTimeout(() => this.setState({ lock: 'held' }), 650);

    const s = this.state;
    const size = this.props.size ?? 'full';
    const mode = this.props.mode ?? 'cook';
    const compact = size === 'compact';
    const { dark, t } = atTheme(s.theme, s.sysDark);
    const held = s.lock === 'held';
    const live = held || s.lock === 'requesting';
    const running = held && !s.paused;
    const isCook = mode === 'cook', isClock = mode === 'clock', isMin = mode === 'minimal';

    const digits = isClock ? this.hm(s.now) : this.hms(s.el);

    let meta = '';

      credit: 'display: inline-flex; align-items: center; min-height: 24px; font-size: 12px; line-height: 16px; color: ' + t.muted + '; text-decoration: underline; text-decoration-color: ' + t.line2 + '; text-underline-offset: 2px; white-space: nowrap',
      showDigits: !isMin, noDigits: isMin, digitFont: AT_DIGITS,
      minimalNote: live ? 'Keeping this screen on while this page is visible.' : 'Keeps this screen on while you read.',
      digits, digitColor: running || (isClock && live) ? t.ink : t.muted,
      digitsAria: isCook && held ? (s.paused ? 'Resume the timer, ' + digits : 'Pause the timer, ' + digits) : (isClock ? 'Current time ' + digits : 'Keep screen awake, ' + digits),
      pausedAria: s.paused ? 'true' : 'false',
      bigSize: bigPx + 'px', bigWeight: bigPx > 28 ? 200 : 300,
      hint, hintOrMeta: hint || meta,
      btnStart: atBtn(primary, t) + '; flex-shrink: 0; width: ' + btnW + 'px; padding: 0',
      btnStop: atBtn('stop', t) + '; flex-shrink: 0; width: ' + btnW + 'px; padding: 0' + (isCook ? '; height: 64px' : ''),
      btnStartS: atBtn('smallLamp', t) + '; width: 96px; padding: 0',
      btnStopS: atBtn('smallStop', t) + '; width: 96px; padding: 0',
      gridRows: stacked ? 'min-content' : 'minmax(0, 1fr)',
      fullCols: showTimers && !stacked ? 'minmax(0, 1fr) 264px' : 'minmax(0, 1fr)', showTitle: stacked ? width >= 400 : narrow ? width >= 460 : !(showTimers && width < 700),
      timersStyle: 'position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; ' + (stacked ? 'padding-top: 16px' : 'padding-inline-start: 24px'),
      dividerStyle: 'position: absolute; background: ' + t.line + '; ' + (stacked ? 'left: 0; right: 0; top: 0; height: 1px' : 'left: 0; top: 0; bottom: 0; width: 1px'),
      footMeta: isClock ? new Date(s.now).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : 'Works while this page is visible',
      showTimers, timersId: this.tid, timers, quick, canAdd: s.timers.length < 3, noTimers: s.timers.length === 0,
      announce: s.announce,
      start: () => this.start(),
      stop: () => { clearTimeout(this.boot); this.setState({ lock: 'idle', paused: false, el: 0 }); },
      tapDigits: () => {
        const st = this.state;
        if (st.lock === 'idle') { this.start(); return; }
        if (isCook && st.lock === 'held') this.setState({ paused: !st.paused });

  }
}
