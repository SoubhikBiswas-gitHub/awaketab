<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AwakeTab · extension settings light, no Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 4144px">
<dc-import name="ExtOptions" theme="light" pro="{{false}}" hint-size="1280px,4144px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":4144}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
