<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AwakeTab · kiosk wall screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&amp;family=Geist+Mono:wght@200;300;400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* AwakeTab primitives v2 · fix batch 2b · keep byte-identical */
:root{--ease:cubic-bezier(.22,1,.36,1)}
body{margin:0;font-family:Geist,system-ui,sans-serif}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease),transform .18s var(--ease)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--at-focus,#5BE0E8);outline-offset:3px}
.at-root{transition:background .9s var(--ease),color .9s var(--ease)}
.at-slide{transition:transform .6s var(--ease),background-color .5s var(--ease),border-color .5s var(--ease),color .5s var(--ease)}
.at-in{animation:at-in .7s var(--ease) both}
.at-halo{transform-box:fill-box;transform-origin:center;animation:at-halo 3.4s var(--ease) infinite}
.at-aura{animation:at-aura 26s ease-in-out infinite alternate}
.at-u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.at-u:hover{text-decoration-thickness:2px}
@keyframes at-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes at-halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes at-aura{0%{transform:translate(-6%,-3%) scale(1)}100%{transform:translate(6%,4%) scale(1.12)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.at-lin{transition:transform 1s linear,clip-path 1s linear,opacity 1s linear}
.ks-shift{transition:transform 1.2s var(--ease)}
</style>
</helmet>
<div class="at-root" role="region" aria-label="{{regionAria}}" style="--at-focus: {{t.lamp}}; width: {{z.W}}; height: {{z.H}}; box-sizing: border-box; position: relative; overflow: hidden; background: {{bg}}; color: {{t.ink}}">
  <sc-if value="{{showAura}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" class="at-aura" style="position: absolute; left: -20%; top: -6%; width: 140%; height: 90%; background: radial-gradient(38% 44% at 50% 50%, {{aura}} 0%, transparent 70%); pointer-events: none"></div>
  </sc-if>

  <div class="ks-shift" style="position: absolute; inset: 0; transform: translate({{shiftX}}, {{shiftY}})">

    <sc-if value="{{showTopRow}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 0; right: 0; top: 0; box-sizing: border-box; padding: {{z.edge}}; display: flex; align-items: center; justify-content: space-between; gap: 32px">
        <div style="display: flex; align-items: center; gap: 24px; min-width: 0">
          <sc-if value="{{showPreview}}" hint-placeholder-val="{{false}}">
            <span style="display: inline-flex; align-items: center; height: 48px; padding: 0 20px; box-sizing: border-box; border-radius: 999px; border: 1px solid {{lampLine}}; background: {{lampSoft}}; color: {{t.ink}}; font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Preview</span>
            <span role="timer" style="{{digitFont}}; font-size: 32px; line-height: 40px; color: {{t.ink2}}; white-space: nowrap">{{previewText}}</span>
          </sc-if>
          <sc-if value="{{showEndedNote}}" hint-placeholder-val="{{false}}">
            <span class="at-in" style="font-size: 32px; line-height: 40px; color: {{t.ink2}}">Message preview ended. A Kiosk licence or Pro keeps it on.</span>
          </sc-if>
        </div>
        <sc-if value="{{wmTop}}" hint-placeholder-val="{{false}}">
          <div aria-label="AwakeTab" role="img" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em; color: {{t.ink2}}">
            <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" style="overflow: visible"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="{{t.ink2}}" stroke-width="4.5" stroke-linecap="round"></path><circle cx="24" cy="9" r="4.2" fill="{{pill.tone}}"></circle></svg>
            <span aria-hidden="true">AwakeTab</span>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{showClock}}" hint-placeholder-val="{{true}}">
      <div class="at-in" style="position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{z.clockGap}}; padding: {{z.clockPad}}">
        <sc-if value="{{showLogo}}" hint-placeholder-val="{{false}}">
          <div role="img" aria-label="Your logo (placeholder)" data-placeholder="customer logo" style="width: {{z.logoW}}; height: {{z.logoH}}; box-sizing: border-box; border-radius: 28px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center; gap: 24px; color: {{t.ink2}}; margin-bottom: {{z.logoGap}}">
            <svg width="{{z.logoIcon}}" height="{{z.logoIcon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
            <span style="font-size: {{z.logoText}}; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Your logo</span>
          </div>
        </sc-if>
        <time aria-label="{{clockAria}}" style="display: flex; flex-direction: {{z.clockDir}}; align-items: {{z.clockAlign}}; gap: {{z.suffixGap}}; {{digitFont}}; font-weight: 200; letter-spacing: -0.04em; color: {{t.ink}}">
          <span style="font-size: {{clockSize}}; line-height: 0.9; white-space: nowrap">{{clk.hm}}</span>
          <span style="display: flex; flex-direction: {{z.suffixDir}}; gap: 16px; padding-top: {{suffixTop}}; font-size: {{suffixSize}}; line-height: 1; letter-spacing: 0; font-weight: 300">
            <span style="color: {{t.ink2}}">{{clk.ap}}</span>
            <span style="color: {{t.muted}}">{{clk.s}}</span>
          </span>
        </time>
        <div aria-hidden="true" style="position: relative; width: {{trackW}}; height: 24px">
          <div style="position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center">

              <span style="width: 4px; height: {{tk.h}}; border-radius: 999px; background: {{tk.c}}"></span>
            </sc-for>
          </div>
          <div class="at-lin" style="position: absolute; inset: 0; transform: translateX({{secPct}})">
            <span style="position: absolute; left: -8px; top: 4px; width: 16px; height: 16px; border-radius: 999px; background: {{pill.tone}}; box-shadow: 0 0 24px {{toneGlow}}"></span>
            <span class="at-halo" style="position: absolute; left: -8px; top: 4px; width: 16px; height: 16px; border-radius: 999px; background: {{pill.tone}}"></span>
          </div>
        </div>
        <div style="font-size: 40px; line-height: 48px; color: {{t.ink2}}; letter-spacing: -0.01em; text-align: center">{{dateLong}}</div>
      </div>
    </sc-if>

    <sc-if value="{{showMessage}}" hint-placeholder-val="{{false}}">
      <div class="at-in" style="position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: {{z.msgGap}}; padding: {{z.clockPad}}; padding-inline: {{z.side}}; text-align: center">
        <p dir="auto" style="margin: 0; max-width: {{z.msgMax}}; font-size: {{z.msgSize}}; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; color: {{t.ink}}">{{message}}</p>
        <div style="display: flex; align-items: baseline; justify-content: center; gap: 16px 32px; flex-wrap: wrap; font-size: 32px; line-height: 40px; color: {{t.muted}}">
          <time style="{{digitFont}}; color: {{t.ink2}}">{{nowTime}}</time>
          <span>{{dateLong}}</span>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showDash}}" hint-placeholder-val="{{false}}">

          <sc-for list="{{panels}}" as="pn" hint-placeholder-count="6">
            <div style="position: relative; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
              <span style="width: {{pn.titleW}}; height: 16px; border-radius: 999px; background: {{t.track}}"></span>
              <span style="width: 120px; height: 44px; border-radius: 12px; background: {{t.track}}"></span>
              <svg viewBox="0 0 400 120" preserveAspectRatio="none" style="width: 100%; flex-grow: 1; min-height: 0; display: block"><path d="{{pn.d}}" fill="none" stroke="{{t.line2}}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>
            </div>
          </sc-for>
        </div>
      </div>
      <div data-placeholder="embed widget shown at 2×" style="position: absolute; inset-inline-end: {{z.dockEnd}}; bottom: {{z.dockBottom}}; width: 640px; height: 208px; filter: drop-shadow(0 30px 60px {{dockShadow}})">
        <div role="region" aria-label="Keep screen awake" style="position: absolute; left: 0; top: 0; width: 320px; height: 104px; box-sizing: border-box; transform: scale(2); transform-origin: 0 0; overflow: hidden; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px">
          <div aria-hidden="true" style="position: absolute; left: -20%; top: -60%; width: 90%; height: 180%; background: radial-gradient(45% 45% at 50% 50%, {{wAura}} 0%, transparent 70%); pointer-events: none"></div>
          <div style="position: relative; height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <output aria-live="polite" class="at-slide" style="{{wPill.style}}"><svg width="{{wPill.g}}" height="{{wPill.g}}" viewBox="0 0 12 12" aria-hidden="true" style="{{wPill.gStyle}}"><path d="{{wPill.d}}" fill="{{wPill.fill}}" stroke="{{wPill.tone}}" stroke-width="1.6" fill-rule="evenodd" stroke-linejoin="round"></path></svg>{{wPill.label}}</output>
            <sc-if value="{{showAttrib}}" hint-placeholder-val="{{true}}">
              <a href="https://awaketab.com/?ref=embed&amp;source=embed" target="_blank" rel="noopener" style="{{credit}}">Keep awake by AwakeTab</a>
            </sc-if>
          </div>
          <div style="position: relative; height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px">
            <span role="timer" aria-label="{{elapsedAria}}" style="{{digitFont}}; font-weight: 300; font-size: 28px; line-height: 1; letter-spacing: -0.02em; color: {{t.ink}}; white-space: nowrap">{{elapsed}}</span>
            <button onClick="{{toggleRun}}" style="{{wBtn}}">{{wBtnLabel}}</button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showStatus}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: {{z.edge}}; display: flex; align-items: center; justify-content: space-between; gap: 32px">
        <div style="display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; min-width: 0">
          <output aria-live="polite" class="at-slide" style="{{pill.style}}"><svg width="{{pill.g}}" height="{{pill.g}}" viewBox="0 0 12 12" aria-hidden="true" style="{{pill.gStyle}}"><path d="{{pill.d}}" fill="{{pill.fill}}" stroke="{{pill.tone}}" stroke-width="1.6" fill-rule="evenodd" stroke-linejoin="round"></path></svg>{{pill.label}}</output>
          <span style="font-size: 32px; line-height: 40px; color: {{t.muted}}; white-space: nowrap">{{statusMeta}}</span>
        </div>
        <sc-if value="{{wmBottom}}" hint-placeholder-val="{{false}}">
          <div aria-label="AwakeTab" role="img" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em; color: {{t.ink2}}">
            <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" style="overflow: visible"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="{{t.ink2}}" stroke-width="4.5" stroke-linecap="round"></path><circle cx="24" cy="9" r="4.2" fill="{{pill.tone}}"></circle></svg>
            <span aria-hidden="true">AwakeTab</span>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>

  if (kind === 'smallLamp') return base + 'height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: ' + t.lamp + '; color: ' + t.onLamp + '; font-size: 15px; line-height: 22px';
  if (kind === 'smallStop') return base + 'height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: ' + t.stopBg + '; color: ' + t.stopInk + '; font-size: 15px; line-height: 22px';
  if (kind === 'quiet') return base + 'height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: transparent; color: ' + t.ink2 + '; font-size: 15px; line-height: 22px; font-weight: 500';
  return base + 'height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid ' + t.line2 + '; background: ' + t.surface + '; color: ' + t.ink + '; font-size: 15px; line-height: 22px';
}
// Card (§11.6): surface, 1 px line, r16, padding 20 phone / 24.
function atCard(t, phone) { return 'box-sizing: border-box; background: ' + t.surface + '; border: 1px solid ' + t.line + '; border-radius: 16px; padding: ' + (phone ? 20 : 24) + 'px; box-shadow: ' + t.elev; }
// Tag (§11.4): 24 high, 12/16 600, r999, padding 0 8, 1 px line-strong (or a tone at 12 %).
function atTag(t, tone) {
  return 'display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; color: ' + t.ink + '; ' +
    (tone ? 'background: ' + atRgba(tone, 0.12) + '; border: 1px solid ' + atRgba(tone, 0.38) : 'background: transparent; border: 1px solid ' + t.line2);
}
// Keyboard hint (§11.4): one theme keycap everywhere, never inherits the button it sits on.
function atKbd(t) { return 'display: inline-flex; align-items: center; justify-content: center; height: 24px; min-width: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid ' + t.line2 + '; box-shadow: inset 0 -1px 0 ' + t.line2 + '; background: ' + t.raised + '; font-family: ui-monospace, \'Geist Mono\', monospace; font-size: 12px; line-height: 16px; font-weight: 500; color: ' + t.ink + '; vertical-align: middle'; }
function atCode(t) { return AT_MONO + '; font-size: 14px; padding: 0 4px; border-radius: 4px; background: ' + t.sunken + '; color: ' + t.ink + '; overflow-wrap: anywhere'; }
// Segmented bar (§11.4): 1 px border + 4 px padding + 44 px items = 54. Selected = lamp 14 % + 1 px lamp 45 % (or raised for neutral switches).
function atSeg(options, current, onPick, t, opts) {
  const o = opts || {};
  const n = options.length;
  const i = Math.max(0, options.findIndex((x) => x[0] === current));
  return {
    bar: 'position: relative; display: grid; grid-template-columns: repeat(' + n + ', minmax(0, 1fr)); padding: 4px; box-sizing: border-box; border-radius: 999px; background: ' + t.surface + '; border: 1px solid ' + t.line + (o.max ? '; max-width: ' + o.max : ''),
    ind: 'position: absolute; left: 4px; top: 4px; width: calc((100% - 8px) / ' + n + '); height: 44px; box-sizing: border-box; border-radius: 999px; transform: translateX(' + i * 100 + '%); ' + (o.neutral ? 'background: ' + t.raised + '; border: 0' : 'background: ' + atRgba(t.lamp, 0.14) + '; border: 1px solid ' + atRgba(t.lamp, 0.45)),
    items: options.map(([id, label, aria]) => ({
      id, label, aria: aria || label, sel: id === current ? 'true' : 'false', pick: () => onPick(id),
      style: 'position: relative; min-width: 0; height: 44px; padding: 0 8px; border: 0; background: transparent; border-radius: 999px; font-size: ' + (o.fs || 15) + 'px; line-height: 22px; font-weight: ' + (id === current ? 600 : 500) + '; color: ' + (id === current ? t.ink : t.ink2) + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis'
    }))
  };
}
// Header (§11.6): 60 phone / 68 ≥ tablet, gutter = page gutter, logo 26 + wordmark 17 with gap 8, nav on desktop, theme switch as a segmented bar.
const AT_NAV = [['Use cases', '#', 'for'], ['Devices', '#', 'on'], ['Extension', 'PageExtensionDesk.dc.html', 'extension'], ['Pro', 'Pro.dc.html', 'pro']];
const AT_THEME_ICON = {
  light: ['M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4', ''],
  dark: ['M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z', ''],
  auto: ['M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16z', 'M12 4a8 8 0 0 1 0 16z']
};
function atHeader(c, t, layout, current, bead) {
  const theme = c.state.theme === 'light' || c.state.theme === 'dark' ? c.state.theme : 'auto';
  const order = ['light', 'dark', 'auto'];
  return {
    style: 'position: relative; height: ' + (layout === 'phone' ? 60 : 68) + 'px; flex-shrink: 0; box-sizing: border-box; padding-inline: ' + AT_GUTTER[layout] + 'px; display: flex; align-items: center; justify-content: space-between; gap: 16px',
    logo: 'display: flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: ' + t.ink + '; font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em',
    ink: t.ink, bead: bead || t.muted,
    showNav: layout === 'desktop',
    navStyle: 'display: flex; align-items: center; gap: 32px',
    nav: AT_NAV.map(([label, href, id]) => ({
      label, href, cur: id === current ? 'page' : 'false',
      style: 'display: flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; font-size: 15px; line-height: 22px; font-weight: ' + (id === current ? 600 : 500) + '; color: ' + (id === current ? t.ink : t.ink2),
      dot: 'width: 6px; height: 6px; border-radius: 999px; background: ' + (id === current ? t.lamp : 'transparent')
    })),
    bar: 'position: relative; display: grid; grid-template-columns: repeat(3, 44px); padding: 4px; box-sizing: border-box; border-radius: 999px; background: ' + t.surface + '; border: 1px solid ' + t.line,
    ind: 'position: absolute; left: 4px; top: 4px; width: 44px; height: 44px; border-radius: 999px; background: ' + t.raised + '; transform: translateX(' + order.indexOf(theme) * 44 + 'px)',
    themes: order.map((id) => ({
      sel: id === theme ? 'true' : 'false', aria: id === 'auto' ? 'Auto, follows your system' : id === 'light' ? 'Light' : 'Dark', title: id === 'auto' ? 'Auto: follows your system' : id === 'light' ? 'Light' : 'Dark',
      icon: AT_THEME_ICON[id][0], icon2: AT_THEME_ICON[id][1],
      pick: () => c.setState({ theme: id }),
      style: 'position: relative; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; color: ' + (id === theme ? t.ink : t.muted)
    }))
  };
}
// Footer (§11.7): 1 px line top, padding 24 (phone 32 bottom), honest line left in caption muted, links right.
const AT_FOOT_LINKS = [['Privacy', 'PagePrivacyDesk.dc.html'], ['Terms', 'PageTermsPhone.dc.html'], ['Changelog', 'PageChangelogPhone.dc.html'], ['About', 'PageAboutDesk.dc.html'], ['Buy me a coffee', 'https://buymeacoffee.com/awaketab']];
function atFooter(t, layout) {
  const g = AT_GUTTER[layout];
  return {
    style: 'flex-shrink: 0; margin-top: ' + AT_SECTION[layout] + 'px; box-sizing: border-box; padding: 24px ' + g + 'px ' + (layout === 'phone' ? 32 : 24) + 'px; border-top: 1px solid ' + t.line + '; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px',
    line: 'margin: 0; font-size: 13px; line-height: 18px; color: ' + t.muted,
    nav: 'display: flex; flex-wrap: wrap; column-gap: 20px',
    link: 'min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; line-height: 20px; color: ' + t.ink2 + '; text-decoration: none',
    links: AT_FOOT_LINKS.map(([label, href]) => ({ label, href }))
  };
}
/* ── end primitives ── */

// TV / kiosk scale (DESIGN.md §11.5, ≥ 1920 wide): meta 32, date 40, message 96–128, clock digits face-specific; pill L (§11.4).
const STATE = { awake: 'held', paused: 'lost', fallback: 'fallback' };
const MESSAGE = 'Welcome. Please ring the bell.';
// Burn-in protection: the stage moves at most 2 px, one step every 60 s (also under reduced motion, instantly).
const SHIFTS = [[0, 0], [2, 0], [2, 2], [0, 2], [-2, 2], [-2, 0], [-2, -2], [0, -2], [2, -2]];
const SIZES = {
  tv: {
    W: '1920px', H: '1080px', edge: '48px 96px', side: '96px',
    clockDir: 'row', clockAlign: 'flex-start', suffixDir: 'column', suffixGap: '32px', clockGap: '48px', clockPad: '0 0 96px',
    msgSize: '128px', msgMax: '1560px', msgGap: '64px',
    logoW: '620px', logoH: '220px', logoIcon: 64, logoText: '48px', logoGap: '8px',
    dashPad: '48px 64px 64px', dashCols: 3, dockEnd: '96px', dockBottom: '96px'
  },
  portrait: {
    W: '1080px', H: '1920px', edge: '64px 64px', side: '64px',
    clockDir: 'column', clockAlign: 'center', suffixDir: 'row', suffixGap: '8px', clockGap: '64px', clockPad: '96px 0',
    msgSize: '112px', msgMax: '900px', msgGap: '64px',
    logoW: '820px', logoH: '320px', logoIcon: 80, logoText: '64px', logoGap: '64px',
    dashPad: '64px 64px 384px', dashCols: 2, dockEnd: '220px', dockBottom: '96px'
  }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const now = Date.now();
    this.state = { theme: props.theme ?? 'dark', sysDark: this.sys(), now, startedAt: now - (5 * 3600 + 28 * 60 + 14) * 1000, shift: 0, previewLeft: 60, running: true };
    this.panels = this.makePanels();
  }
  sys() { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; } }
  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 1000);
    this.shiftTimer = setInterval(() => this.setState({ shift: (this.state.shift + 1) % SHIFTS.length }), 60000);
    try {
      this.mq = window.matchMedia('(prefers-color-scheme: dark)');
      this.onMq = (e) => this.setState({ sysDark: e.matches });
      this.mq.addEventListener('change', this.onMq);
    } catch (e) {}
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearInterval(this.shiftTimer);
    if (this.mq) this.mq.removeEventListener('change', this.onMq);
  }
  componentDidUpdate(prev) {
    if (prev.theme !== this.props.theme && this.props.theme) this.setState({ theme: this.props.theme });
    if (prev.mode !== this.props.mode || prev.licensed !== this.props.licensed) this.setState({ previewLeft: 60 });
  }
  tick() {
    const s = this.state;
    this.setState({ now: Date.now(), previewLeft: Math.max(0, s.previewLeft - 1) });
  }
  makePanels() {
    let x = 11;
    const r = () => (x = (x * 16807) % 2147483647) / 2147483647;
    const out = [];
    for (let i = 0; i < 6; i++) {
      let y = 40 + r() * 50;
      let d = 'M0 ' + y.toFixed(1);
      for (let k = 1; k <= 16; k++) { y = Math.max(8, Math.min(112, y + (r() - 0.5) * 36)); d += 'L' + (k * 25) + ' ' + y.toFixed(1); }
      out.push({ d, titleW: Math.round(140 + r() * 120) + 'px' });
    }
    return out;
  }
  hm(ms) { return new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }
  dateLong(ms) {
    const d = new Date(ms);
    return d.toLocaleDateString('en-GB', { weekday: 'long' }) + ', ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  hms(sec) {
    const v = Math.max(0, Math.floor(sec));
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(v / 3600)) + ':' + p(Math.floor((v % 3600) / 60)) + ':' + p(v % 60);
  }
  renderVals() {
    const s = this.state;
    const p = this.props;
    const size = p.size === 'portrait' ? 'portrait' : 'tv';
    const z = SIZES[size];
    const mode = ['clock', 'message', 'logo', 'dashboard-overlay'].includes(p.mode) ? p.mode : 'clock';
    const licensed = p.licensed !== false && p.licensed !== 'false';
    const status = ['awake', 'fallback', 'paused'].includes(p.status) ? p.status : 'awake';
    const { dark, t } = atTheme(s.theme, s.sysDark);
    const isDash = mode === 'dashboard-overlay';
    const wState = isDash && !s.running ? 'idle' : STATE[status];
    const pill = atPill('L', wState, t);
    const now = s.now;
    const d = new Date(now);
    const h12 = d.getHours() % 12 || 12;
    const mm = String(d.getMinutes()).padStart(2, '0');
    const sec = d.getSeconds();
    const clk = { hm: h12 + ':' + mm, ap: d.getHours() < 12 ? 'AM' : 'PM', s: String(sec).padStart(2, '0') };
    const ticks = [];
    for (let i = 0; i < 60; i++) ticks.push({ h: i % 5 === 0 ? '24px' : '12px', c: i <= sec ? atRgba(pill.tone, i % 5 === 0 ? 0.9 : 0.55) : t.tick });

    const msgFree = mode === 'message' && !licensed;
    const msgEnded = msgFree && s.previewLeft <= 0;
    const showMessage = mode === 'message' && !msgEnded;
    const showLogo = mode === 'logo' && licensed;
    const showClock = mode === 'clock' || mode === 'logo' || msgEnded;
    const small = mode === 'logo';
    const portrait = size === 'portrait';
    const [sx, sy] = SHIFTS[s.shift];
    const since = this.hm(s.startedAt);
    const statusMeta = status === 'paused' ? 'Resumes when this tab is in front' : 'No limit · since ' + since;
    const elapsedSec = (now - s.startedAt) / 1000;
    const wPill = atPill('XS', s.running ? STATE[status] : 'idle', t);

    return {
      t, z, clk, ticks, pill, wPill, bg: atGround(t), digitFont: AT_DIGITS, message: MESSAGE,
      regionAria: 'AwakeTab kiosk screen, ' + pill.label,
      showAura: !isDash && s.theme !== 'oled',
      aura: atRgba(pill.tone, dark ? 0.12 : 0.08),
      shiftX: sx + 'px', shiftY: sy + 'px',
      lampLine: atRgba(t.lamp, 0.45), lampSoft: atRgba(t.lamp, 0.14),
      toneGlow: wState === 'idle' ? 'transparent' : atRgba(pill.tone, 0.8),
      statusLabel: pill.label, statusMeta,
      showTopRow: msgFree || (!licensed && portrait && !isDash),
      showPreview: msgFree && !msgEnded, showEndedNote: msgEnded,
      previewText: 'Ends in ' + s.previewLeft + ' s',
      wmTop: !licensed && portrait && !isDash, wmBottom: !licensed && !portrait && !isDash,
      showClock, showLogo, showMessage, showDash: isDash, showStatus: !isDash,
      clockSize: small ? (portrait ? '240px' : '240px') : (portrait ? '320px' : '400px'),
      suffixSize: small ? '64px' : '96px',
      suffixTop: portrait ? '0px' : (small ? '24px' : '48px'),
      trackW: small ? (portrait ? '620px' : '720px') : (portrait ? '820px' : '1120px'),
      secPct: (sec / 59) * 100 + '%',
      clockAria: 'The time is ' + this.hm(now),
      dateLong: this.dateLong(now), nowTime: this.hm(now),
      panels: this.panels, dockShadow: dark ? 'rgba(0,0,0,0.45)' : 'rgba(14,23,38,0.2)',
      wAura: atRgba(wPill.tone, s.running ? (dark ? 0.16 : 0.1) : 0.04),
      credit: 'display: inline-flex; align-items: center; min-height: 24px; font-size: 12px; line-height: 16px; color: ' + t.muted + '; text-decoration: underline; text-decoration-color: ' + t.line2 + '; text-underline-offset: 2px; white-space: nowrap',
      elapsed: s.running ? this.hms(elapsedSec) : '00:00:00',
      elapsedAria: 'Awake for ' + this.hms(elapsedSec),
      wBtn: atBtn(s.running ? 'smallStop' : 'smallLamp', t) + '; width: 96px; padding: 0', wBtnLabel: s.running ? 'Stop' : 'Start',
      showAttrib: !licensed,
      toggleRun: () => this.setState({ running: !this.state.running, startedAt: this.state.running ? this.state.startedAt : Date.now() })
    };
  }
}
</script>
