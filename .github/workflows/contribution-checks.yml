name: Contribution checks

on:
  pull_request:
  push:
    branches: [main, play]

permissions:
  contents: read

jobs:
  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
