<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AwakeTab</title>
  </head>
  <body>
    <div class="wl" data-root hidden>
      <div class="wl-aura" aria-hidden="true"></div>
      <header class="wl-head">
        <div class="at-logo">
          <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path class="at-logo-ring" d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke-width="4.5" stroke-linecap="round"></path>
            <circle class="at-logo-bead" cx="24" cy="9" r="7.5" opacity="0.28"></circle>
            <circle class="at-logo-bead" cx="24" cy="9" r="4.2"></circle>
          </svg>
          <span data-i18n="app.name"></span><span class="at-logo-sub" data-i18n="ext.options.forChrome"></span>
        </div>
        <div class="wl-head-end">
          <nav class="wl-nav" data-i18n-aria="ext.welcome.navLabel">
            <a class="at-link at-link-ink" href="options.html" data-i18n="settings.title"></a>
            <a class="at-link" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.popup.open"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></a>
          </nav>
          <div class="at-seg wl-theme" role="radiogroup" data-i18n-aria="settings.theme" style="--n: 3">
            <span class="at-seg-ind" aria-hidden="true"></span>
            <label class="at-seg-item" data-i18n-title="settings.theme.light"><input class="at-sr" type="radio" name="theme" value="light" data-i18n-aria="settings.theme.light" /><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></label>
            <label class="at-seg-item" data-i18n-title="settings.theme.dark"><input class="at-sr" type="radio" name="theme" value="dark" data-i18n-aria="settings.theme.dark" /><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></label>
            <label class="at-seg-item" data-i18n-title="ext.theme.autoAria"><input class="at-sr" type="radio" name="theme" value="auto" data-i18n-aria="ext.theme.autoAria" /><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg></label>
          </div>
        </div>
      </header>

      <main class="wl-main">
        <section class="wl-hero" aria-labelledby="w-h1">
          <div class="wl-hero-text at-in">
            <p class="wl-kicker at-kick"><span class="wl-kicker-dot" aria-hidden="true"></span><span data-installed></span></p>
            <h1 id="w-h1" data-i18n="ext.welcome.title"></h1>
            <p class="wl-lead" data-i18n="ext.welcome.lead"></p>
            <ol class="wl-steps" data-pin-steps>
              <li><span class="wl-step" aria-hidden="true">1</span><span data-i18n="ext.welcome.step1"></span></li>
              <li><span class="wl-step" aria-hidden="true">2</span><span data-step2></span></li>
            </ol>
          </div>

          <figure class="wl-mock at-rise" data-i18n-aria="ext.welcome.figure" data-pin-figure>
            <div class="wl-window" data-placeholder="Chrome window">
              <div class="wl-bar">
                <span class="wl-dots" aria-hidden="true"><span></span><span></span><span></span></span>
                <div class="wl-url" aria-hidden="true">awaketab.com</div>
                <span class="wl-pinned at-in" data-pinned hidden>
                  <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path class="at-logo-ring" d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke-width="5.5" stroke-linecap="round"></path><circle cx="24" cy="9" r="5.2" fill="currentColor"></circle></svg>
                  <span class="wl-badge" aria-hidden="true">25m</span>
                </span>
                <span class="wl-slot" aria-hidden="true" data-slot></span>
                <span class="wl-puzzle" data-puzzle aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4.5a2 2 0 0 1 4 0V6h4v4h-1.5a2 2 0 0 0 0 4H17v4h-4v-1.5a2 2 0 0 0-4 0V18H5v-4h1.5a2 2 0 0 0 0-4H5V6h4z"></path></svg>
                  <span class="wl-mark" data-mark>1</span>
                </span>
                <span class="wl-avatar" aria-hidden="true"></span>
              </div>
              <div class="wl-lines" aria-hidden="true"><span></span><span></span><span></span></div>
              <div class="wl-menu" data-placeholder="Chrome extensions menu">
                <div class="wl-menu-title" aria-hidden="true" data-i18n="ext.welcome.menu"></div>
                <div class="wl-menu-row">
                  <span class="wl-menu-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 48 48"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="#EAF0F7" stroke-width="4.6" stroke-linecap="round"></path><circle cx="24" cy="9" r="4.6" fill="#5BE0E8"></circle></svg></span>
                  <span class="wl-menu-name" data-store-name></span>
                  <button class="wl-pin" type="button" aria-pressed="false" data-pin>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5h6l-1 5 3.5 3.5h-11L10 8.5zM12 12v8.5"></path></svg>
                    <span class="wl-mark" data-mark aria-hidden="true">2</span>
                  </button>
                </div>
                <div class="wl-menu-ghost" aria-hidden="true"><span></span><span></span></div>
                <div class="wl-menu-foot" aria-hidden="true" data-i18n="ext.welcome.manage"></div>
              </div>
              <svg class="wl-pointer" width="30" height="34" viewBox="0 0 30 34" aria-hidden="true" data-pointer><path d="M4 2l20 16-9 1.5 5.5 11-4 2-5.5-11L4 27z" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.6" stroke-linejoin="round"></path></svg>
              <div class="wl-mock-foot">
                <p aria-live="polite" data-pin-caption></p>
                <button class="at-btn" type="button" data-pin-button></button>
              </div>
            </div>
          </figure>
        </section>

        <section class="wl-section" aria-labelledby="w-how">
          <div class="wl-how-head">
            <h2 id="w-how" data-i18n="ext.welcome.how.title"></h2>
            <p class="wl-muted" data-i18n="ext.welcome.how.sub"></p>
          </div>
          <div class="wl-how">
            <div class="wl-how-rule" aria-hidden="true"></div>
            <ol class="wl-how-list">
              <li>
                <span class="wl-num" aria-hidden="true">1</span>
                <div class="wl-art" aria-hidden="true">
                  <div class="at-seg at-seg-sunken at-seg-lamp wl-art-seg" style="--n: 4; --i: 2">
                    <span class="at-seg-ind"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.p15"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.p30"></span>
                    <span class="at-seg-item wl-art-on" data-i18n="tool.preset.p60"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.pinf"></span>
                  </div>
                  <div class="wl-art-until" data-art-until></div>
                </div>
                <h3 data-i18n="ext.welcome.how1.title"></h3>
                <p data-art-how1></p>
              </li>
              <li>
                <span class="wl-num" aria-hidden="true">2</span>
                <div class="wl-art wl-art-row" aria-hidden="true">
                  <span class="wl-art-toolbar" data-placeholder="Chrome toolbar">
                    <svg width="34" height="34" viewBox="0 0 48 48"><path class="at-logo-ring" d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke-width="5.5" stroke-linecap="round"></path><circle cx="24" cy="9" r="5.2" fill="currentColor"></circle></svg>
                    <span class="wl-art-badge" data-placeholder="Chrome badge">25m</span>
                  </span>
                  <span class="wl-art-state">
                    <span class="at-pill" data-lock="held"><svg class="at-pill-glyph" viewBox="0 0 12 12"><path d="M6 1.5a4.5 4.5 0 1 1 0 9a4.5 4.5 0 1 1 0-9z"></path></svg><span data-i18n="tool.pill.held"></span></span>
                    <span class="wl-muted-sm" data-i18n="ext.welcome.how2.art"></span>
                  </span>
                </div>
                <h3 data-i18n="ext.welcome.how2.title"></h3>
                <p data-i18n="ext.welcome.how2.body"></p>
              </li>
              <li>
                <span class="wl-num" aria-hidden="true">3</span>
                <div class="wl-art wl-art-row" aria-hidden="true">
                  <div class="wl-notif" data-placeholder="system notification">
                    <span class="wl-menu-icon wl-notif-icon"><svg width="20" height="20" viewBox="0 0 48 48"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="#EAF0F7" stroke-width="4.6" stroke-linecap="round"></path><circle cx="24" cy="9" r="4.6" fill="#5BE0E8"></circle></svg></span>
                    <span class="wl-notif-title" data-i18n="end.notify.title"></span>
                    <span class="wl-notif-body" data-notify-body></span>
                    <span class="wl-notif-actions"><span data-i18n="tool.extend.add30"></span><span data-i18n="tool.extend.stop"></span></span>
                  </div>
                </div>
                <h3 data-i18n="ext.welcome.how3.title"></h3>
                <p data-i18n="ext.welcome.how3.body"></p>
              </li>
            </ol>
          </div>
        </section>

        <section class="wl-section" aria-labelledby="w-level">
          <div class="wl-level-head">
            <h2 id="w-level" data-i18n="ext.welcome.level.title"></h2>
            <p class="wl-lead" data-i18n="ext.welcome.level.lead"></p>
          </div>
          <div class="wl-levels">
            <article class="wl-levelcard" aria-labelledby="lv-screen" data-level="display">
              <div class="wl-laptop" aria-hidden="true" data-placeholder="laptop illustration">
                <div class="wl-screen"><svg width="46" height="46" viewBox="0 0 48 48"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"></path><circle class="wl-screen-bead" cx="24" cy="9" r="4.4"></circle></svg></div>
                <div class="wl-base"></div>
                <span class="wl-cpu"></span>
              </div>
              <div class="wl-levelcard-text">
                <div class="wl-levelcard-title"><h3 id="lv-screen" data-i18n="ext.level.display"></h3><span class="wl-badgetag wl-badgetag-screen">ON</span></div>
                <p class="wl-ink" data-i18n="ext.level.display.help"></p>
                <p class="wl-ink2" data-i18n="ext.welcome.level.screenGood"></p>
                <p class="wl-reads"><span data-i18n="ext.welcome.level.reads"></span> <span class="wl-minipill"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5a4.5 4.5 0 1 1 0 9a4.5 4.5 0 1 1 0-9z"></path></svg><span data-i18n="tool.pill.held"></span></span></p>
              </div>
            </article>
            <article class="wl-levelcard" aria-labelledby="lv-system" data-level="system">
              <div class="wl-laptop" aria-hidden="true" data-placeholder="laptop illustration">
                <div class="wl-screen"><svg width="46" height="46" viewBox="0 0 48 48"><path d="M32.8 11.4A16 16 0 1 1 15.2 11.4" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"></path><circle class="wl-screen-bead" cx="24" cy="9" r="4.4"></circle></svg></div>
                <div class="wl-base"></div>
                <span class="wl-cpu"></span>
              </div>
              <div class="wl-levelcard-text">
                <div class="wl-levelcard-title"><h3 id="lv-system" data-i18n="ext.level.system"></h3><span class="wl-badgetag wl-badgetag-system">SYS</span></div>
                <p class="wl-ink" data-i18n="ext.level.system.help"></p>
                <p class="wl-ink2" data-i18n="ext.welcome.level.systemGood"></p>
                <p class="wl-reads"><span data-i18n="ext.welcome.level.reads"></span> <span class="wl-minipill"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path fill-rule="evenodd" d="M6 .8a5.2 5.2 0 1 1 0 10.4a5.2 5.2 0 1 1 0-10.4zM6 2.3a3.7 3.7 0 1 1 0 7.4a3.7 3.7 0 1 1 0-7.4zM6 2.3a3.7 3.7 0 0 0 0 7.4z"></path></svg><span data-i18n="ext.pill.systemHeld"></span></span></p>
              </div>
            </article>
          </div>
        </section>

        <section class="wl-key" aria-labelledby="w-key">
          <div class="wl-keycaps" aria-hidden="true" data-keycaps></div>
          <div class="wl-key-text">
            <h2 id="w-key" data-key-title></h2>
            <p data-i18n="ext.welcome.key.body"></p>
          </div>
          <button class="at-btn" type="button" data-shortcut-change data-i18n="ext.options.shortcut.change"></button>
        </section>

        <section class="wl-section wl-two" data-i18n-aria="ext.welcome.limitsLabel">
          <div class="wl-col">
            <h2 data-i18n="ext.welcome.cant.title"></h2>
            <ul class="wl-list">
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v10H4zM2 19h20"></path></svg><span data-i18n="ext.welcome.cant.lid"></span></li>
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18zM5.6 5.6l12.8 12.8"></path></svg><span data-i18n="ext.welcome.cant.presence"></span></li>
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6"></path></svg><span data-i18n="ext.welcome.cant.closed"></span></li>
            </ul>
          </div>
          <div class="wl-col">
            <h2 data-i18n="ext.welcome.see.title"></h2>
            <ul class="wl-list wl-list-ok">
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span data-i18n="ext.welcome.see.account"></span></li>
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span data-i18n="ext.welcome.see.permissions"></span></li>
              <li><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span data-i18n="ext.welcome.see.data"></span></li>
            </ul>
            <a class="at-link" href="https://awaketab.com/privacy#extension" target="_blank" rel="noopener" data-i18n="ext.privacy.policy"></a>
          </div>
        </section>

        <section class="wl-next" aria-labelledby="w-next">
          <div class="wl-next-text">
            <h2 id="w-next" data-i18n="ext.welcome.next.title"></h2>
            <p data-i18n="ext.welcome.next.body"></p>
          </div>
          <div class="wl-next-actions">
            <a class="at-btn at-btn-stop at-btn-medium" href="options.html" data-i18n="ext.welcome.openSettings"></a>
            <a class="at-btn at-btn-sec at-btn-medium" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.popup.open"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></a>
          </div>
        </section>
      </main>

      <footer class="at-foot">
        <p data-i18n="ext.footer.honest"></p>
        <nav data-i18n-aria="ext.footer.nav">
          <a href="https://awaketab.com/privacy" target="_blank" rel="noopener" data-i18n="footer.privacy"></a>
          <a href="https://awaketab.com/terms" target="_blank" rel="noopener" data-i18n="footer.terms"></a>
          <a href="https://awaketab.com/changelog" target="_blank" rel="noopener" data-i18n="footer.changelog"></a>
          <a href="https://awaketab.com/about" target="_blank" rel="noopener" data-i18n="ext.about.title"></a>
          <a href="https://buymeacoffee.com/awaketab" target="_blank" rel="noopener" data-i18n="footer.donate"></a>
        </nav>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
